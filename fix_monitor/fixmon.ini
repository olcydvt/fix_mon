# fixmon collector configuration

[global]
db_path          = ./fixmon.db
metrics_port     = 9109
queue_size       = 65536      # rounded up to a power of two
batch_size       = 500        # rows per sqlite transaction
batch_flush_ms   = 200        # flush even if the batch is not full
poll_interval_ms = 100        # log tail poll interval
from_beginning   = false      # true to replay existing log content on startup

# How long a log reader will wait for room in the internal queue before giving
# up on an event and counting it as dropped.
#
# Waiting is usually the right trade. The source is a file on disk, so a reader
# that pauses here simply stops consuming it for a moment and the unread lines
# wait where they already are - we lose latency, not data. Set to 0 to drop
# immediately instead. Watch fixmon_queue_full_waits_total: movement means the
# consumer is not keeping up, and fixmon_events_dropped_total means the wait
# was not long enough.
queue_full_wait_ms = 250

# Store client identity and commercial detail - account, order ids, symbol,
# side, quantity, price - as <masked> rather than the value.
#
# On by default. This tool answers "is the link healthy", and that question
# never needs to know the price. Sequence numbers, message types, comp ids and
# reject codes are always kept: they are what a diagnosis actually runs on.
#
# Credential tags (Username, Password, RawData and friends) are masked no
# matter what this is set to. That is not a policy choice.
mask_message_bodies = true

# Days of history kept in the event store. A background purge removes anything
# older on an hourly cadence. 0 disables it, and the store then grows without
# bound - a running record of a counterparty's traffic that nobody pruned is a
# liability, so make that an explicit decision rather than an accident.
retention_days = 30

# A session is considered stale after heartbeat_interval * this many seconds
# with no inbound traffic.
stale_after_multiple = 2

# How often session state is written to session_snapshots.
snapshot_interval_s  = 30

# Import sessions from the FIX engine's own config file. Repeatable, and a
# comma separated list works too. The engine already knows its session list and
# where it writes the logs; restating that here is how the two drift apart.
#
# What gets imported: BeginString, comp ids, SessionQualifier, HeartBtInt,
# ConnectionType, StartTime/EndTime, and the log paths resolved under
# FileLogPath. Credentials are dropped while the file is being read.
#
# quickfix_config = ./quickfix.cfg

# A [session] block is only needed for sessions the engine config cannot
# describe, or to override something it got wrong. Any field left out here is
# filled in from the engine config when the session appears in both.
[session]
begin_string       = FIX.4.4
sender_comp_id     = BROKER1
target_comp_id     = VENUEX
message_log        = ./logs/BROKER1-VENUEX.messages.log
event_log          = ./logs/BROKER1-VENUEX.event.log
heartbeat_interval = 30

# How this session handles sequence numbers. Normally imported from the engine
# config above and not written here at all - these four are only worth setting
# by hand when the engine's cfg is out of reach, on another host or in a form we
# were not pointed at.
#
# They matter because they decide what a sequence gap means. "Expected 5,
# received 1" is correct behaviour when reset_on_logon is Y and a lost-message
# incident when it is N, and the evidence in the log is identical either way.
# Left unset they read as "unknown", which is reported as unknown rather than
# guessed - a wrong answer here would still be delivered as an answer.
#
# reset_on_logon      = N
# reset_on_logout     = N
# reset_on_disconnect = N
# persist_messages    = Y

# Add one block per session. Either log path may be omitted; the collector
# simply runs fewer adapters for that session.
#
# [session]
# begin_string       = FIX.4.2
# sender_comp_id     = BROKER1
# target_comp_id     = VENUEY
# message_log        = ./logs/BROKER1-VENUEY.messages.log
# event_log          = ./logs/BROKER1-VENUEY.event.log
# heartbeat_interval = 30
