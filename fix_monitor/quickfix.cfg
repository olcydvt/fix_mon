# A QuickFIX engine configuration - this is the engine's file, not fixmon's.
#
# fixmon opens it read-only and takes: the session list, BeginString, comp ids,
# HeartBtInt, ConnectionType, the schedule, FileLogPath, and the four settings
# below that govern sequence numbers. Everything else is the engine's business.
#
# Credentials are dropped while the file is being parsed. Password below never
# reaches a variable, a metric, the event store or a log line; only the key name
# survives, so startup can say it was ignored on purpose.
#
# Paths here match the demo logs in ./logs, so this works out of the box:
#   ./build/fixmon --quickfix quickfix.cfg --print-config

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=30
FileStorePath=./store
FileLogPath=./logs
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
SenderCompID=BROKER1
UseDataDictionary=Y

# How sequence numbers behave. fixmon reads these because without them a gap
# cannot be judged: under ResetOnLogon=Y a counterparty starting again at 1 is
# exactly right, and under N the same observation means messages were lost.
# PersistMessages=N additionally means a ResendRequest can only ever be answered
# with a gap fill, so "ask them to resend" would be advice that cannot work.
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
PersistMessages=Y

# Dropped at parse time. Put a real one here and grep the metrics endpoint for
# it afterwards - it will not be there.
Username=broker1
Password=do-not-log-me

[SESSION]
BeginString=FIX.4.4
TargetCompID=VENUEX
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
DataDictionary=FIX44.xml

# A second session the collector would pick up automatically, with no change to
# fixmon.ini. This is the whole point: the engine's session list is the source
# of truth, so a session added here cannot be forgotten in the monitor.
#
# [SESSION]
# BeginString=FIX.4.2
# TargetCompID=VENUEY
# SocketConnectHost=127.0.0.1
# SocketConnectPort=5002
# HeartBtInt=60

