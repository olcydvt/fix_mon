# Collector config used inside the compose stack. Paths match the container
# layout.
#
# Note what is missing: there is no [session] block. The session list, its
# heartbeat and both log paths all come from the engine's own cfg mounted next
# to this file. Add a [session] block only to override something the engine
# config cannot express.

[global]
db_path          = /var/lib/fixmon/fixmon.db
metrics_port     = 9109
queue_size       = 65536
batch_size       = 500
batch_flush_ms   = 200
poll_interval_ms = 100
from_beginning   = true
stale_after_multiple = 2

# How often session state is written to session_snapshots.
snapshot_interval_s  = 30

# The engine's own file. Everything about the session is read from here.
quickfix_config = /etc/fixmon/quickfix.cfg

