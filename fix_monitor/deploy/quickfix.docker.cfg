# QuickFIX engine configuration for the compose demo.
#
# This file belongs to the engine side. fixmon mounts it read-only and takes
# the session list, the heartbeat and the log location out of it. Nothing in
# here is fixmon's own format.
#
# The loggen service stands in for the engine and writes
#   /logs/FIX.4.4-BROKER1-VENUEX.messages.current.log
#   /logs/FIX.4.4-BROKER1-VENUEX.event.current.log
# which is exactly the naming the C++ engine derives from the session below.
# fixmon derives the same names and finds the files without being told.

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=30
FileStorePath=/var/lib/quickfix/store
FileLogPath=/logs
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
SenderCompID=BROKER1
UseDataDictionary=Y

# Dropped while this file is being parsed. The values never reach a variable,
# a metric, the event store or a log line - only the key names survive, and
# they surface as a count in fixmon_session_config_redacted.
#
# Grep the scrape endpoint for the password after the stack is up; it is not
# there:  curl -s localhost:9109/metrics | grep demo-secret
Username=broker1
Password=demo-secret-do-not-log

[SESSION]
BeginString=FIX.4.4
TargetCompID=VENUEX
SocketConnectHost=venue-gw.example.com
SocketConnectPort=9823
DataDictionary=FIX44.xml

